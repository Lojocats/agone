name: Create Release

# Déclenchée par un tag v* poussé à la main, ou appelée par auto-tag.yml après un changement
# de version de system.json.

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: Tag de la release (vX.Y.Z)
        required: true
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Get tag name
        id: tag
        run: echo "version=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Create archive
        run: |
          # Créer un ZIP du système (exclure les fichiers non pertinents)
          zip -r agone.zip \
            css/ \
            lang/ \
            module/ \
            packs/ \
            templates/ \
            system.json \
            -x "*.git*" "*.gitignore" "_*.py"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          files: agone.zip
          body: |
            Système Agone ${{ steps.tag.outputs.version }}

            Pour installer : téléchargez `agone.zip` et extrayez-le dans votre dossier FoundryVTT/Data/systems/agone
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
