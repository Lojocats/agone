name: CI main, tag automatique de version

# À chaque push sur main : lint et tests. Si la version de system.json n'a pas encore de tag,
# création du tag vX.Y.Z puis de la release, une fois lint et tests passés.
# Un tag poussé avec GITHUB_TOKEN ne déclenche pas d'autre workflow : la release est donc
# appelée directement (release.yml est réutilisable), pas via l'évènement « push tag ».

on:
  push:
    branches: [main]

permissions:
  contents: read

# Une seule exécution à la fois sur main, sans annuler celle en cours (deux exécutions
# simultanées pourraient vouloir créer le même tag).
concurrency:
  group: auto-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/lint.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.lire.outputs.tag }}
      nouveau: ${{ steps.lire.outputs.nouveau }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags existants

      - name: Lire la version et vérifier le tag
        id: lire
        run: |
          TAG="v$(jq -r .version system.json)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "Le tag $TAG existe déjà : rien à faire."
            echo "nouveau=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nouvelle version : $TAG"
            echo "nouveau=true" >> "$GITHUB_OUTPUT"
          fi

  tag:
    needs: [version, checks]
    if: needs.version.outputs.nouveau == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Créer et pousser le tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  release:
    needs: [version, tag]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
