name: Lint & tests

# Pull requests, et appel par auto-tag.yml (chaque push sur main) et par release.yml (tag poussé
# à la main). Pas de déclencheur « push sur main » ici : auto-tag.yml s'en charge, ce qui évite
# de lancer lint et tests deux fois lors d'une release.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# Le nom du workflow appelant entre dans le groupe : un appel depuis auto-tag.yml ou release.yml
# ne partage donc pas le groupe de l'appelant. Seules les pull requests annulent l'exécution
# précédente (une release en cours ne doit pas être interrompue).
concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm test
