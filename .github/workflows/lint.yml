name: Lint & tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # appelé par auto-tag.yml avant de créer le tag d'une nouvelle version

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm test
